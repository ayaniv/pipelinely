# ~/.tmux.conf — Claude Code optimized

# Prefix: Ctrl+A (easier than Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# History & mouse
set -g history-limit 50000
set -g mouse on

# Forward modified keys (Shift+Enter, etc.) through to the running app.
# Without these, tmux collapses Shift+Enter to plain Enter and Claude Code
# submits instead of inserting a newline.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Intuitive splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Status bar
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-right '%H:%M '
